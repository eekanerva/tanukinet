---
- name: Updating Debian(-based) machines
  hosts: tanukipi, debianvm, testvm, kalivm, serveli
  become: true
  ignore_unreachable: true
  tasks:
    - name: Updating through APT...
      ansible.builtin.apt:
        name: "*"
        state: latest
        
        
        
- name: Updating TanukiPi's Pi-Hole
  hosts: tanukipi
  become: true
  ignore_unreachable: true
  tasks:
   - name: updating
     command: pihole -up
     register: pihole_update_result
     changed_when: "'Everything is up to date!' not in pihole_update_result.stdout"


   - name: Display Pi-Hole update results
     debug:
       var: pihole_update_result.stdout_lines


    
- name: Updating Leap machines
  hosts: leapvm
  become: true
  ignore_unreachable: true
  tasks:
   - name: updating...
     community.general.zypper:
      name: '*'
      state: latest
      simple_errors: true
      quiet: false


     

     
